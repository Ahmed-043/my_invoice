name: invoice_app
description: A professional invoice management application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"              # ← name prefix for generated files
  ios: true                            # ← set to false if you only want Android now
  image_path: "assets/icon/icon.png"    # ← path to your 1024×1024 icon
  adaptive_icon_background: "#0D2B45"   # ← background color for Android adaptive icon (optional)
  adaptive_icon_foreground: "assets/icon/icon.png"  # ← usually same as main icon
  min_sdk_android: 21                   # ← safe default
